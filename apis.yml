aid: vrchat
name: VRChat
description: 'VRChat is a social virtual-reality platform where users create avatars
  and worlds in Unity with the first-party VRChat SDK (Worlds, Avatars, Udon and UdonSharp),
  publish them through the VRChat Package Manager, and meet inside a persistent multi-user
  universe playable on PC VR, standalone headsets and desktop. VRChat operates a live
  web API at api.vrchat.cloud that powers its own client and website, but it explicitly
  does not document, version, or support that API for public use: its Creator Guidelines
  state endpoints may be added, removed, or changed with no warning. The machine-readable
  surface VRChat does publish is the creator toolchain — the VPM package listings at
  packages.vrchat.com, the vpm CLI on NuGet, the OSC and OSCQuery interfaces for external
  avatar and input control, an llms.txt documentation index, and a public Statuspage.'
