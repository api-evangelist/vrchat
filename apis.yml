    url: conventions/vrchat-conventions.yml
  - type: RateLimits
    url: conventions/vrchat-conventions.yml
- aid: vrchat:vrchat-vpm
  name: VRChat Package Manager (VPM) Listing API
  description: 'The VRChat Package Manager repository API — machine-readable VPM listing
    documents served over HTTP that enumerate every first-party VRChat SDK package
    (Base, Worlds, Avatars, Package Resolver) and the curated community listing, with
    every published version, its display name, description, Unity requirements and
    dependency graph. This is the registry the VRChat Creator Companion and the vpm
    CLI read, and it is the one fully documented, fully machine-readable public API
    surface VRChat ships.'
  humanURL: https://vcc.docs.vrchat.com/vpm/
  baseURL: https://packages.vrchat.com
  tags:
  - Package Management
