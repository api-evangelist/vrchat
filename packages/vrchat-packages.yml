notes: 'VRChat ships no client SDK for its web API — it publishes no REST specification
  and states in its Creator Guidelines that it does not support third-party API applications.
  The first-party package surface is the Unity creator toolchain, distributed as VPM
  (VRChat Package Manager) packages from VRChat''s own listing host, plus two .NET
  tools on NuGet. The widely used npm package "vrchat" and the vrchatapi/* client
  libraries are COMMUNITY projects, not VRChat releases, and are recorded under
  third_party below rather than as official packages.'
