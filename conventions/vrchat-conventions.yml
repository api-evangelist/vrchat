    body: '{"error":{"message":"\"Missing Credentials\"","status_code":401}}'
    url: https://api.vrchat.cloud/api/1/auth/user
    fetched: '2026-08-05'
  - status: 404
    body: '{"error":"The endpoint you''re looking for is not implemented by our system.","status_code":404}'
    url: https://api.vrchat.cloud/api/1/nonexistent-ae-probe
    fetched: '2026-08-05'
  note: The envelope is not consistent — the 401 nests error as an object with message
    and status_code, the 404 returns error as a plain string alongside a sibling
    status_code. Content type is application/json, not application/problem+json.
    Recorded from live probes; VRChat publishes no error reference, so no
    type ErrorCatalog pointer is wired.
