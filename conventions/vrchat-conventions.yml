content_restrictions:
- Do not create or use software, scripts, or applications that upload content such
  as worlds, avatars, or other similar asset types on a user's behalf, whether server-hosted
  or client-run.
- Don't be malicious. If you're doing something disruptive, VRChat will moderate the
  application and all users of it.
support_posture:
  third_party_api_apps_supported: false
  statement: VRChat provides no support for third-party applications using the API.
